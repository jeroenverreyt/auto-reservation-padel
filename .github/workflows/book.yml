name: Padel boeken

on:
  schedule:
    # elk uur van 07:00 tot 23:00 (UTC+1); pas aan aan het boekingsvenster van de club
    - cron: "0 6-22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Droge modus (niet echt boeken)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: padel-booker

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Boek padelterreinen uit de agenda
        env:
          TPV_USER: ${{ secrets.TPV_USER }}
          TPV_PASS: ${{ secrets.TPV_PASS }}
          ICAL_URL: ${{ secrets.ICAL_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || vars.DRY_RUN || '1' }}
        run: node book.js
      - name: Onthoud geboekte afspraken
        if: always()
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "padel-booker"
            git config user.email "padel-booker@users.noreply.github.com"
            git add state && git commit -m "Geboekte padelafspraken bijwerken" && git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: out/
          if-no-files-found: ignore
